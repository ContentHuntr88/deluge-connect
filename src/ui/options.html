<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Deluge Connect Settings</title>

    <link
        rel="stylesheet"
        href="options.css"
    >
</head>

<body>
    <main class="page">
        <section class="card">
            <header class="header">
                <h1>Deluge Connect</h1>

                <p>
                    Connect this browser to your Deluge WebUI.
                </p>
            </header>

            <form id="settingsForm">
                <label for="serverUrl">
                    Deluge server URL
                </label>

                <input
                    id="serverUrl"
                    name="serverUrl"
                    type="url"
                    placeholder="http://10.14.88.11:8112"
                    autocomplete="url"
                    required
                >

                <label for="password">
                    Deluge password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

                <div class="actions">
                    <button
                        id="saveButton"
                        type="submit"
                    >
                        Save Settings
                    </button>

                    <button
                        id="testButton"
                        type="button"
                    >
                        Test Connection
                    </button>
                </div>
            </form>

            <p
                id="status"
                class="status"
                role="status"
                aria-live="polite"
            ></p>
        </section>
    </main>

    <script
        type="module"
        src="options.js"
    ></script>
</body>
</html>
